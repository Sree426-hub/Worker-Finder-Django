{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
   <style>
       
   body{
    background:
    url("{% static 'images/auth-bg.jpg' %}")
    no-repeat center center fixed;

    background-size: cover;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}
 </style>
</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">User Registration</h2>

                <form method="POST">

    {% csrf_token %}
{% if errors %}
<div class="alert alert-danger">{% for e in errors %}<div>{{ e }}</div>{% endfor %}</div>
{% endif %}

    <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" value="{{ data.name|default:'' }}" class="form-control">
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input type="email" name="email" value="{{ data.email|default:'' }}" class="form-control">
    </div>

    <div class="mb-3">
        <label>Password</label>
        <input type="password" name="password" class="form-control">
    </div>

    <button class="btn btn-primary w-100 py-2">
        Register
    </button>

</form>
            </div>

        </div>

    </div>

</div>

</body>
</html>
