{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
 <style>
       
   body{
    background:
    url("{% static 'images/auth-bg.jpg' %}")
    no-repeat center center fixed;

    background-size: cover;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}
 </style>
<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Login
                </h2>
                {% for message in messages %}

<div class="alert alert-danger">

    {{ message }}

</div>

{% endfor %}

                <form method="POST">

                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="mb-3">

                        <label>Email</label>

                        <input type="email"
                               name="email"
                               class="form-control">

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <input type="password"
                               name="password"
                               class="form-control">

                    </div>

                    <button class="btn btn-primary w-100">
                        Login
                    </button>

                </form>

                {% if demo_enabled %}
                <hr>
                <p class="text-center text-muted small mb-2">Just exploring? One-click demo with Bengaluru data</p>
                <form method="POST" action="/demo_login/customer/" class="mb-2">
                    {% csrf_token %}
                    <button class="btn btn-outline-primary w-100">Demo Customer Login</button>
                </form>
                <form method="POST" action="/demo_login/worker/">
                    {% csrf_token %}
                    <button class="btn btn-outline-dark w-100">Demo Worker Login</button>
                </form>
                {% endif %}

            </div>

        </div>

    </div>

</div>

</body>
</html>
