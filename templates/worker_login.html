{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Worker Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<style>
       
   body{
    background:
    url("{% static 'images/auth-bg.jpg' %}")
    no-repeat center center fixed;

    background-size: cover;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}
 </style>
<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">

                    Worker Login

                </h2>

                <form method="POST">

                    {% csrf_token %}
                     {% if error %}
                       <div class="alert alert-danger">
                         {{ error }}
                        </div>
                     {% endif %}

                    <div class="mb-3">

                        <label>Phone</label>

                        <input type="text"
                               name="phone"
                               class="form-control">

                    </div>

                    <div class="mb-3">

                        <label>Aadhaar</label>

                        <input type="password"
                               name="aadhaar"
                               class="form-control">

                    </div>

                    <button class="btn btn-warning w-100">

                        Login

                    </button>

                </form>

                {% if demo_enabled %}
                <hr>
                <form method="POST" action="/demo_login/worker/">
                    {% csrf_token %}
                    <button class="btn btn-outline-dark w-100">Demo Worker Login (Bengaluru plumber)</button>
                </form>
                {% endif %}

            </div>

        </div>

    </div>

</div>

</body>
</html>
