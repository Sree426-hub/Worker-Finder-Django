{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
       
   body{
    background:
    url("{% static 'images/auth-bg.jpg' %}")
    no-repeat center center fixed;

    background-size: cover;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}
 </style>
<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">Edit Profile</h2>

                <form method="POST" enctype="multipart/form-data">

                    {% csrf_token %}
{% if errors %}
<div class="alert alert-danger">{% for e in errors %}<div>{{ e }}</div>{% endfor %}</div>
{% endif %}

                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text" name="name" value="{{ data.name|default:'' }}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Skill</label>
                        <input type="text" name="skill" value="{{ data.skill|default:'' }}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Phone</label>
                        <input type="text" name="phone" value="{{ data.phone|default:'' }}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Address</label>
                        <textarea name="address" class="form-control">{{ data.address|default:'' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label>Area <small class="text-muted">(e.g. Marathahalli, Whitefield, HSR Layout)</small></label>
                        <input type="text" name="area" value="{{ data.area|default:'' }}" class="form-control">
                    </div>

                    <p class="text-muted small">Aadhaar cannot be changed here.</p>

                    <div class="mb-3">
                        <label>Experience</label>
                        <input type="number" name="experience" value="{{ data.experience|default:'' }}" class="form-control">
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label>Visit charge (&#8377;)</label>
                            <input type="number" min="0" name="visit_charge" value="{{ data.visit_charge|default_if_none:'' }}" class="form-control">
                        </div>
                        <div class="col-6 mb-3">
                            <label>Full-day rate (&#8377;)</label>
                            <input type="number" min="0" name="day_rate" value="{{ data.day_rate|default_if_none:'' }}" class="form-control">
                        </div>
                    </div>
                    <div class="mb-3">
    <label>Profile Image <small class="text-muted">(optional)</small></label>
    {% if worker.image %}
    <div class="mb-2"><img src="{{ worker.image.url }}" height="80" class="rounded"></div>
    {% endif %}
    <input type="file" name="image" class="form-control">
    {% if worker.image %}
    <div class="form-check mt-2">
        <input type="checkbox" name="image-clear" id="image-clear" class="form-check-input">
        <label for="image-clear" class="form-check-label">Remove current photo</label>
    </div>
    {% endif %}
</div>

                    <div class="form-check form-switch mb-3">
                        <input type="checkbox" name="available" id="available" class="form-check-input"
                               {% if data.available %}checked{% endif %}>
                        <label for="available" class="form-check-label">
                            Available for bookings
                            <small class="text-muted">(turn off if you are not working here now)</small>
                        </label>
                    </div>

                    <div class="form-check form-switch mb-3">
                        <input type="checkbox" name="available_now" id="available_now" class="form-check-input"
                               {% if data.available_now %}checked{% endif %}>
                        <label for="available_now" class="form-check-label">
                            Available Now
                            <small class="text-muted">(can reach customers today, shows in the Urgent filter)</small>
                        </label>
                    </div>

                    <button class="btn btn-primary w-100">
                        Save Changes
                    </button>
                    <a href="/view_bookings/" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
