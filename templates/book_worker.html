{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Book Worker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background:
            linear-gradient(rgba(255,255,255,0.25), rgba(255,255,255,0.25)),
            url("{% static 'images/auth-bg.jpg' %}")
            no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Book {{ worker.name }}
                </h2>

                <form method="POST">

                    {% csrf_token %}
{% if errors %}
<div class="alert alert-danger">{% for e in errors %}<div>{{ e }}</div>{% endfor %}</div>
{% endif %}

                    <div class="mb-3">
                        <label>Your Name</label>
                        <input type="text"
                               name="customer_name" value="{{ data.customer_name|default:'' }}"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Phone</label>
                        <input type="text"
                               name="customer_phone" value="{{ data.customer_phone|default:'' }}"
                               class="form-control">
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="date">Date</label>
                            <input type="date" id="date" name="date" class="form-control"
                                   min="{{ today }}" max="{{ max_date }}"
                                   value="{{ data.date|default:'' }}" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label for="time_slot">Time slot</label>
                            <select id="time_slot" name="time_slot" class="form-select" required>
                                <option value="">Choose</option>
                                {% for key, label in slots %}
                                <option value="{{ key }}" {% if data.time_slot == key %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label>Address</label>
                        <textarea name="address"
                                  class="form-control">{{ data.address|default:'' }}</textarea>
                    </div>

                    <button class="btn btn-success w-100">
                        Confirm Booking
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
