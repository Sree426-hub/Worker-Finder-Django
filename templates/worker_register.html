{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
       
   body{
    background:
    url("{% static 'images/auth-bg.jpg' %}")
    no-repeat center center fixed;

    background-size: cover;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}
 </style>
<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">Worker Registration</h2>

                <form method="POST" enctype="multipart/form-data">

                    {% csrf_token %}
{% if errors %}
<div class="alert alert-danger">{% for e in errors %}<div>{{ e }}</div>{% endfor %}</div>
{% endif %}

                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text" name="name" value="{{ data.name|default:'' }}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Skill</label>
                        <input type="text" name="skill" value="{{ data.skill|default:'' }}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Phone</label>
                        <input type="text" name="phone" value="{{ data.phone|default:'' }}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Address</label>
                        <textarea name="address" class="form-control">{{ data.address|default:'' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label>Area <small class="text-muted">(e.g. Marathahalli, Whitefield, HSR Layout)</small></label>
                        <input type="text" name="area" value="{{ data.area|default:'' }}" class="form-control">
                    </div>


                    <div class="mb-3">
                        <label>Aadhaar</label>
                        <input type="text" name="aadhaar" value="{{ data.aadhaar|default:'' }}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Experience</label>
                        <input type="number" name="experience" value="{{ data.experience|default:'' }}" class="form-control">
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label>Visit charge (&#8377;)</label>
                            <input type="number" min="0" name="visit_charge" value="{{ data.visit_charge|default_if_none:'' }}" class="form-control">
                        </div>
                        <div class="col-6 mb-3">
                            <label>Full-day rate (&#8377;)</label>
                            <input type="number" min="0" name="day_rate" value="{{ data.day_rate|default_if_none:'' }}" class="form-control">
                        </div>
                    </div>
                    <div class="mb-3">
    <label>Profile Image <small class="text-muted">(optional)</small></label>
    <input type="file" name="image" class="form-control">
</div>

                    <button class="btn btn-primary w-100">
                        Register Worker
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
